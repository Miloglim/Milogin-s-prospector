services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: milogin_center
      POSTGRES_USER: milogin_app
      POSTGRES_PASSWORD: ${PROSPECTOR_CENTER_PG_PASSWORD:?set PROSPECTOR_CENTER_PG_PASSWORD}
    volumes:
      - prospector-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milogin_app -d milogin_center"]
      interval: 10s
      timeout: 5s
      retries: 10

  center:
    build: .
    restart: unless-stopped
    environment:
      PROSPECTOR_CENTER_MODE: production
      PROSPECTOR_CENTER_PUBLIC_ORIGIN: ${PROSPECTOR_CENTER_PUBLIC_ORIGIN:?set PROSPECTOR_CENTER_PUBLIC_ORIGIN}
      PROSPECTOR_NAVIGATOR_URL: ${PROSPECTOR_NAVIGATOR_URL:?set PROSPECTOR_NAVIGATOR_URL}
      PROSPECTOR_NAVIGATOR_ENTRY_URL: ${PROSPECTOR_NAVIGATOR_ENTRY_URL:?set PROSPECTOR_NAVIGATOR_ENTRY_URL}
      PROSPECTOR_CENTER_BIND_HOST: 0.0.0.0
      PROSPECTOR_CENTER_RUNTIME_DIR: /var/lib/prospector-center
      PROSPECTOR_CENTER_PG_HOST: ${PROSPECTOR_CENTER_PG_HOST:?set PROSPECTOR_CENTER_PG_HOST}
      PROSPECTOR_CENTER_PG_PORT: ${PROSPECTOR_CENTER_PG_PORT:-5432}
      PROSPECTOR_CENTER_PG_USER: ${PROSPECTOR_CENTER_PG_USER:?set PROSPECTOR_CENTER_PG_USER}
      PROSPECTOR_CENTER_PG_PASSWORD: ${PROSPECTOR_CENTER_PG_PASSWORD:?set PROSPECTOR_CENTER_PG_PASSWORD}
    volumes:
      - prospector-center:/var/lib/prospector-center
    ports:
      - ${PROSPECTOR_CENTER_BIND_ADDRESS:-127.0.0.1}:55847:55847

  bootstrap-admin:
    build: .
    profiles: ["tools"]
    healthcheck:
      disable: true
    depends_on:
      center:
        condition: service_healthy
    environment:
      PROSPECTOR_CENTER_MODE: production
      PROSPECTOR_CENTER_PUBLIC_ORIGIN: ${PROSPECTOR_CENTER_PUBLIC_ORIGIN:?set PROSPECTOR_CENTER_PUBLIC_ORIGIN}
      PROSPECTOR_CENTER_RUNTIME_DIR: /var/lib/prospector-center
      PROSPECTOR_CENTER_PG_HOST: ${PROSPECTOR_CENTER_PG_HOST:?set PROSPECTOR_CENTER_PG_HOST}
      PROSPECTOR_CENTER_PG_PORT: ${PROSPECTOR_CENTER_PG_PORT:-5432}
      PROSPECTOR_CENTER_PG_USER: ${PROSPECTOR_CENTER_PG_USER:?set PROSPECTOR_CENTER_PG_USER}
      PROSPECTOR_CENTER_PG_PASSWORD: ${PROSPECTOR_CENTER_PG_PASSWORD:?set PROSPECTOR_CENTER_PG_PASSWORD}
      PROSPECTOR_ADMIN_EMAIL: ${PROSPECTOR_ADMIN_EMAIL:?set PROSPECTOR_ADMIN_EMAIL}
    command: ["node", "scripts/bootstrap-production-admin.mjs", "--generate-password", "--credentials-file", "/var/lib/prospector-center/bootstrap-admin.json"]
    volumes:
      - prospector-center:/var/lib/prospector-center

volumes:
  prospector-postgres:
  prospector-center:
