<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的团队 - 成员私聊</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--ink:#18232b;--muted:#68757e;--line:#dfe5e8;--surface:#fff;--soft:#f6f8f8;--canvas:#edf1f2;--rail:#171b1d;--accent:#0f766e;--accent-soft:#e6f4f2;--blue:#2563eb;--amber:#b45309;--red:#c2413b}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;color:var(--ink);background:var(--canvas);font-family:"Noto Sans SC","Microsoft YaHei UI","Segoe UI",sans-serif;font-size:13px}button,input,textarea{font:inherit}.icon{width:15px;height:15px;stroke-width:1.8}
    .app{height:100%;display:grid;grid-template-columns:210px minmax(0,1fr)}.rail{display:flex;flex-direction:column;color:#fff;background:var(--rail)}.brand{padding:28px 22px 22px}.brand strong{display:block;font-size:20px;font-weight:700;letter-spacing:0}.brand span{display:block;margin-top:4px;color:#a6adb0;font-size:11px}.nav{padding:8px 10px;display:grid;gap:3px}.nav button{min-height:38px;display:flex;align-items:center;gap:11px;padding:0 12px;border:0;border-radius:6px;color:rgba(255,255,255,.7);background:transparent;text-align:left;cursor:pointer}.nav button:hover{color:#fff;background:rgba(255,255,255,.055)}.nav button.active{color:#fff;background:rgba(255,255,255,.1)}.rail-spacer{flex:1}.account{min-height:54px;display:flex;align-items:center;gap:9px;padding:0 18px;border-top:1px solid rgba(255,255,255,.08);color:#a6adb0;font-size:11px}
    .shell{min-width:0;min-height:0;display:flex;flex-direction:column}.topbar{flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff}.top-left strong{display:block;font-size:15px}.top-left span{display:block;margin-top:2px;color:var(--muted);font-size:10px}.tools{display:flex;align-items:center;gap:7px}.search{width:210px;height:32px;display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--line);border-radius:6px}.search input{width:100%;border:0;outline:0;font-size:12px}.icon-btn,.primary{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:6px;cursor:pointer}.icon-btn{width:32px;border:1px solid var(--line);background:#fff}.primary{padding:0 11px;border:1px solid var(--accent);color:#fff;background:var(--accent)}
    .workspace{flex:1;min-height:0;display:grid;grid-template-columns:310px minmax(0,1fr) 338px}.tree-panel,.context{min-height:0;background:#fff}.tree-panel{display:flex;flex-direction:column;border-right:1px solid var(--line)}.panel-head{min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line);font-size:11px;font-weight:650}.tree-scroll{flex:1;min-height:0;overflow:auto;padding:8px 7px}.tree-node{width:100%;display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:7px;padding:0 8px;border:0;border-radius:5px;color:#3b4952;background:transparent;text-align:left;cursor:pointer}.tree-node:hover{background:var(--soft)}.tree-node.active{color:var(--accent);background:var(--accent-soft);box-shadow:inset 2px 0 var(--accent);font-weight:650}.tree-company,.tree-admin{min-height:32px}.tree-team{min-height:34px;padding-left:22px}.tree-member{min-height:50px;grid-template-columns:31px minmax(0,1fr) auto;margin-left:36px;width:calc(100% - 36px)}.tree-node span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-node em{color:var(--muted);font-size:9px;font-style:normal}.avatar{width:31px;height:31px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#52707e;font-size:10px;font-weight:700}.member-copy{min-width:0}.member-copy strong,.member-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member-copy strong{font-size:11px}.member-copy small{margin-top:3px;color:var(--muted);font-size:9px}.online{width:7px;height:7px;border-radius:50%;background:#22a06b}.offline{background:#c3cbcf}.invites{padding:7px;border-top:1px solid var(--line);background:#fffdf8}.invite{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:6px 7px;color:#7c5a18;font-size:9px}.invite button{min-height:23px;padding:0 6px;border:1px solid #dcc799;border-radius:4px;color:#7c5a18;background:#fff;font-size:8px;cursor:pointer}
    .chat{min-width:0;min-height:0;display:flex;flex-direction:column;background:#f4f7f7}.chat-head{flex:0 0 62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff}.channel{display:flex;align-items:center;gap:10px}.channel-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:7px;color:var(--accent);background:var(--accent-soft)}.channel strong{display:block;font-size:14px}.channel small{display:block;margin-top:3px;color:var(--muted);font-size:9px}.chat-actions{display:flex;gap:6px}.chat-messages{flex:1;min-height:0;overflow:auto;padding:18px 24px}.day-separator{display:flex;align-items:center;gap:12px;margin:4px 0 16px;color:#89959c;font-size:9px}.day-separator::before,.day-separator::after{content:"";height:1px;flex:1;background:#dce3e5}.message{display:grid;grid-template-columns:32px minmax(0,1fr);gap:9px;margin-bottom:15px}.message .avatar{width:32px;height:32px}.message-head{display:flex;align-items:center;gap:7px}.message-head strong{font-size:11px}.message-head time{color:var(--muted);font-size:9px}.bubble{max-width:760px;margin-top:5px;padding:9px 11px;border:1px solid #e0e6e8;border-radius:7px;background:#fff;color:#37454d;line-height:1.6;font-size:11px}.message.action .bubble{border-left:3px solid var(--amber);background:#fffdf8}.chat-composer{padding:11px 14px;border-top:1px solid var(--line);background:#fff}.composer-box{border:1px solid var(--line);border-radius:7px;background:#fff}.composer-box textarea{width:100%;height:62px;resize:none;padding:9px 10px;border:0;outline:0;font-size:11px}.composer-tools{display:flex;align-items:center;justify-content:space-between;padding:5px 7px;border-top:1px solid #edf0f1}.composer-tools>div{display:flex;gap:3px}.tool{width:27px;height:27px;display:grid;place-items:center;border:0;border-radius:5px;color:var(--muted);background:transparent;cursor:pointer}.send{min-height:27px;padding:0 10px;border:0;border-radius:5px;color:#fff;background:var(--accent);font-size:10px;cursor:pointer}
    .context{display:flex;flex-direction:column;border-left:1px solid var(--line)}.context-body{flex:1;min-height:0;overflow:auto}.member-header{padding:17px 16px 14px;border-bottom:1px solid var(--line);background:#f5faf9}.member-top{display:flex;align-items:center;gap:10px}.member-top .avatar{width:41px;height:41px;font-size:13px}.member-name strong{display:block;font-size:16px}.member-name span{display:block;margin-top:4px;color:var(--muted);font-size:10px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}.tags span{padding:4px 7px;border-radius:4px;color:#50616a;background:#eaf0f1;font-size:9px}.header-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.header-actions button{min-height:32px;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}.header-actions button:first-child{border-color:var(--accent);color:#fff;background:var(--accent)}.section{padding:14px 16px;border-bottom:1px solid var(--line)}.section h3{margin:0 0 10px;color:var(--muted);font-size:10px;font-weight:650}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.stats div{padding:9px;border:1px solid var(--line);border-radius:6px}.stats strong{display:block;font-size:16px}.stats span{display:block;margin-top:3px;color:var(--muted);font-size:9px}.timeline{display:grid}.event{position:relative;padding:0 0 13px 18px}.event:last-child{padding-bottom:0}.event::before{content:"";position:absolute;left:3px;top:4px;bottom:-7px;border-left:1px solid #cfd8dc}.event:last-child::before{display:none}.event::after{content:"";position:absolute;left:0;top:3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}.event strong{display:block;font-size:10px}.event span{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.45}
    .canvas-modal{display:none;position:fixed;inset:0;z-index:20;background:rgba(15,23,42,.25)}.canvas-modal.open{display:grid;place-items:center}.canvas-card{width:min(680px,calc(100vw - 40px));padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 18px 48px rgba(15,23,42,.18)}.canvas-card header{display:flex;align-items:center;justify-content:space-between}.canvas-card h2{margin:0;font-size:16px}.canvas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.canvas-node{padding:12px;border:1px solid var(--line);border-radius:7px;background:#f8fafa}.canvas-node strong{display:block}.canvas-node span{display:block;margin-top:5px;color:var(--muted);font-size:9px}.invite-dialog{display:none;position:fixed;inset:0;z-index:21;background:rgba(15,23,42,.22);place-items:center}.invite-dialog.open{display:grid}.dialog-card{width:360px;padding:16px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 14px 36px rgba(15,23,42,.16)}.dialog-card h2{margin:0 0 12px;font-size:15px}.dialog-card input{width:100%;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:6px;outline:0}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.dialog-actions button{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}.dialog-actions .primary{height:30px}
    @media(max-width:1120px){.app{grid-template-columns:184px minmax(0,1fr)}.workspace{grid-template-columns:285px minmax(0,1fr)}.context{display:none}}
    @media(max-width:860px){body{overflow:auto}.app{height:auto;min-height:100%;grid-template-columns:1fr}.rail{display:none}.topbar{height:auto;min-height:58px;flex-wrap:wrap;padding:10px 12px}.top-left,.tools{width:100%}.search{flex:1;width:auto}.workspace{min-height:720px;grid-template-columns:1fr}.tree-panel{display:none}.chat-messages{padding:14px}.canvas-grid{grid-template-columns:1fr}}
  </style>
  <style>
    .message.mine { grid-template-columns: minmax(0, 1fr) 32px; }
    .message.mine > .avatar { grid-column: 2; grid-row: 1; }
    .message.mine > .message-body { grid-column: 1; grid-row: 1; text-align: right; }
    .message.mine .message-head { justify-content: flex-end; }
    .message.mine .bubble { margin-left: auto; border-color: #c5dfda; background: var(--accent-soft); text-align: left; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail"><div class="brand"><strong>Prospector.</strong><span>Milogin's workspace</span></div><nav class="nav"><button><i data-lucide="inbox" class="icon"></i>收件箱</button><button><i data-lucide="users" class="icon"></i>客户</button><button class="active"><i data-lucide="network" class="icon"></i>团队</button><button><i data-lucide="send" class="icon"></i>发送中心</button><button><i data-lucide="files" class="icon"></i>素材库</button></nav><div class="rail-spacer"></div><div class="account"><i data-lucide="user-round" class="icon"></i><span>你好，管理员</span></div></aside>
    <main class="shell">
      <header class="topbar"><div class="top-left"><strong>我的团队</strong><span>公司 → 管理员 → 团队 → 成员</span></div><div class="tools"><label class="search"><i data-lucide="search" class="icon"></i><input id="search" placeholder="搜索团队或成员" /></label><button class="icon-btn" id="canvas-button" title="团队画布"><i data-lucide="network" class="icon"></i></button><button class="primary" id="invite-button"><i data-lucide="user-plus" class="icon"></i>邀请成员</button></div></header>
      <section class="workspace">
        <aside class="tree-panel"><div class="panel-head"><span>组织结构</span><button class="tool" title="新建团队"><i data-lucide="plus" class="icon"></i></button></div><div class="tree-scroll" id="tree"></div><div class="invites" id="invites"></div></aside>
        <section class="chat"><div class="chat-head"><div class="channel"><span class="channel-icon"><i data-lucide="message-circle" class="icon"></i></span><div><strong id="chat-title">Daisy Zhou</strong><small id="chat-subtitle">私聊 · 华东销售一组</small></div></div><div class="chat-actions"><button class="icon-btn" title="成员信息"><i data-lucide="info" class="icon"></i></button><button class="icon-btn" title="更多"><i data-lucide="ellipsis" class="icon"></i></button></div></div><div class="chat-messages" id="messages"></div><div class="chat-composer"><div class="composer-box"><textarea id="message-input" placeholder="发送消息"></textarea><div class="composer-tools"><div><button class="tool" title="附件"><i data-lucide="paperclip" class="icon"></i></button><button class="tool" title="提及成员"><i data-lucide="at-sign" class="icon"></i></button><button class="tool" title="添加待办"><i data-lucide="circle-check" class="icon"></i></button></div><button class="send" id="send">发送</button></div></div></div></section>
        <aside class="context"><div class="panel-head"><span>成员协作</span><button class="icon-btn" title="关闭"><i data-lucide="x" class="icon"></i></button></div><div class="context-body" id="context-body"></div></aside>
      </section>
    </main>
  </div>
  <div class="canvas-modal" id="canvas-modal"><div class="canvas-card"><header><h2 id="canvas-title">团队画布</h2><button class="icon-btn" id="canvas-close" title="关闭"><i data-lucide="x" class="icon"></i></button></header><div class="canvas-grid" id="canvas-grid"></div></div></div>
  <div class="invite-dialog" id="invite-dialog"><div class="dialog-card"><h2>邀请成员</h2><input id="invite-name" placeholder="姓名或中心账号" /><div class="dialog-actions"><button id="invite-cancel">取消</button><button class="primary" id="invite-submit">发出邀请</button></div></div></div>
  <script>
    const teams={company:{id:'company',name:'Milogin Logistics',parent:null,type:'公司'},east:{id:'east',name:'华东运营组',parent:'company',type:'运营组'},eastA:{id:'eastA',name:'华东销售一组',parent:'east',type:'销售团队'},eastB:{id:'eastB',name:'华东销售二组',parent:'east',type:'销售团队'},south:{id:'south',name:'华南运营组',parent:'company',type:'运营组'},southA:{id:'southA',name:'华南销售一组',parent:'south',type:'销售团队'}};
    const memberSets={eastA:[{id:'daisy',name:'Daisy Zhou',role:'负责人',title:'华东一组负责人',group:'全部成员',online:true,color:'#0f766e'},{id:'yvonne',name:'Yvonne Xu',role:'成员',title:'欧洲航线',group:'欧洲组',online:true,color:'#52707e'},{id:'zayne',name:'Zayne Lin',role:'成员',title:'美线客户开发',group:'美线组',online:true,color:'#496579'},{id:'felix',name:'Felix You',role:'成员',title:'东南亚市场',group:'未分组',online:false,color:'#875c3c'},{id:'jade',name:'Jade Zhou',role:'成员',title:'北美航线',group:'欧洲组',online:true,color:'#5f6f87'},{id:'mia',name:'Mia Chen',role:'成员',title:'拉美市场',group:'美线组',online:false,color:'#80665a'},{id:'alex',name:'Alex Zhang',role:'成员',title:'澳新市场',group:'未分组',online:false,color:'#4f6b66'}],eastB:[{id:'leo',name:'Leo Chen',role:'负责人',title:'华东二组负责人',group:'全部成员',online:true,color:'#0f766e'},{id:'nora',name:'Nora Wei',role:'成员',title:'日韩市场',group:'日韩组',online:true,color:'#5f6f87'}],southA:[{id:'mialin',name:'Mia Lin',role:'负责人',title:'华南一组负责人',group:'全部成员',online:true,color:'#0f766e'},{id:'owen',name:'Owen Huang',role:'成员',title:'中东市场',group:'中东组',online:false,color:'#4f6b66'}],company:[],east:[],south:[]};
    const groups={eastA:['欧洲组','美线组','未分组'],eastB:['日韩组'],southA:['中东组'],company:[],east:[],south:[]};
    const initialThreads={daisy:[{author:'Daisy Zhou',initials:'DZ',time:'09:12',text:'欧洲线报价客户在等目的港费用，今天先一起把这条推进完。',kind:'action'},{author:'我',initials:'我',time:'09:18',text:'收到，我会先核对鹿特丹附加费。'}],yvonne:[{author:'Yvonne Xu',initials:'YX',time:'09:18',text:'鹿特丹目的港费用我已补齐，你帮我看一下附加费口径。'}],zayne:[{author:'Zayne Lin',initials:'ZL',time:'09:20',text:'美线订舱资料还差一份，我先联系客户。'}],felix:[],jade:[],mia:[],alex:[],leo:[{author:'Leo Chen',initials:'LC',time:'09:10',text:'今天华东二组的客户分配我来确认。'}],nora:[],mialin:[],owen:[]};const threads={...initialThreads};
    let selectedMember='daisy',search='',invites=[{name:'Nora Wei'},{name:'Owen Huang'}];
    const initials=name=>name.split(/\s+/).map(part=>part[0]).join('').slice(0,2).toUpperCase();
    const allMembers=()=>Object.values(memberSets).flat();
    const memberById=id=>allMembers().find(member=>member.id===id);
    const teamForMember=id=>Object.entries(memberSets).find(([,list])=>list.some(member=>member.id===id))?.[0]||'eastA';
    const children=id=>Object.values(teams).filter(team=>team.parent===id);
    function matches(text){return !search||text.toLowerCase().includes(search)}
    function renderTree(){const root=teams.company;const memberButton=member=>`<button class="tree-node tree-member ${selectedMember===member.id?'active':''}" data-member="${member.id}"><span class="avatar" style="background:${member.color}">${initials(member.name)}</span><span class="member-copy"><strong>${member.name}</strong><small>${member.title} · ${member.group}</small></span><span class="online ${member.online?'':'offline'}"></span></button>`;document.getElementById('tree').innerHTML=`<button class="tree-node tree-company ${selectedMember? '' : 'active'}" data-team="company"><i data-lucide="building-2" class="icon"></i><span>${root.name}</span><em>12</em></button>${children('company').map(admin=>{const adminMembers=children(admin.id).flatMap(team=>memberSets[team.id]||[]);const adminMatch=matches(admin.name)||adminMembers.some(member=>matches(member.name));return `<button class="tree-node tree-admin" data-team="${admin.id}"><i data-lucide="briefcase-business" class="icon"></i><span>${admin.name}</span><em>${adminMembers.length}</em></button>${children(admin.id).map(team=>{const list=memberSets[team.id]||[];const teamMatch=matches(team.name)||list.some(member=>matches(member.name));return teamMatch||adminMatch?`<button class="tree-node tree-team" data-team="${team.id}"><i data-lucide="users-round" class="icon"></i><span>${team.name}</span><em>${list.length}</em></button>${list.filter(member=>!search||matches(member.name)||matches(member.title)).map(memberButton).join('')}`:'';}).join('')}`;}).join('')}`;document.querySelectorAll('[data-member]').forEach(button=>button.addEventListener('click',()=>selectMember(button.dataset.member)));document.querySelectorAll('[data-team]').forEach(button=>button.addEventListener('click',()=>selectTeam(button.dataset.team)))}
    function renderInvites(){document.getElementById('invites').innerHTML=invites.map(invite=>`<div class="invite"><span>${invite.name} · 待接受</span><button>撤回</button></div>`).join('')}
    function renderChat(){const member=memberById(selectedMember);const list=threads[member.id]||[];document.getElementById('chat-title').textContent=member.name;document.getElementById('chat-subtitle').textContent=`私聊 · ${teams[teamForMember(member.id)].name} · ${member.title}`;document.getElementById('messages').innerHTML=`<div class="day-separator">今天</div>${list.length?list.map(msg=>`<div class="message ${msg.kind||''} ${msg.author==='我'?'mine':''}"><span class="avatar">${msg.initials}</span><div class="message-body"><div class="message-head"><strong>${msg.author}</strong><time>${msg.time}</time></div><div class="bubble">${msg.text}</div></div></div>`).join(''):'<div class="member-copy">还没有消息</div>'}`;document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight}
    function renderContext(){const member=memberById(selectedMember);document.getElementById('context-body').innerHTML=`<div class="member-header"><div class="member-top"><span class="avatar" style="background:${member.color}">${initials(member.name)}</span><span class="member-name"><strong>${member.name}</strong><span>${member.role} · ${teams[teamForMember(member.id)].name}</span></span></div><div class="tags"><span>${member.title}</span><span>${member.group}</span></div><div class="header-actions"><button data-focus-chat="${member.id}"><i data-lucide="message-circle" class="icon"></i>发消息</button><button><i data-lucide="user-round-cog" class="icon"></i>成员管理</button></div></div><section class="section"><h3>协作概况</h3><div class="stats"><div><strong>${member.role}</strong><span>团队角色</span></div><div><strong>${member.group}</strong><span>当前分组</span></div><div><strong>${member.online?'在线':'离线'}</strong><span>当前状态</span></div><div><strong>可协作</strong><span>权限状态</span></div></div></section><section class="section"><h3>最近协作</h3><div class="timeline"><div class="event"><strong>今天更新了客户跟进</strong><span>${member.name} 最近在团队中同步了客户动作</span></div><div class="event"><strong>已加入 ${member.group}</strong><span>由团队负责人完成成员分组</span></div><div class="event"><strong>团队协作权限正常</strong><span>联系人、邮件和任务权限按中心授权</span></div></div></section>`;document.querySelector('[data-focus-chat]')?.addEventListener('click',()=>selectMember(member.id))}
    function renderCanvas(){const member=memberById(selectedMember);const teamId=teamForMember(member.id);const list=memberSets[teamId]||[];document.getElementById('canvas-title').textContent=`${teams[teamId].name} · 团队画布`;document.getElementById('canvas-grid').innerHTML=`<div class="canvas-node"><strong>${teams[teamId].name}</strong><span>${list.length} 位成员</span></div>${(groups[teamId]||[]).map(name=>`<div class="canvas-node"><strong>${name}</strong><span>${list.filter(member=>member.group===name).length} 位成员</span></div>`).join('')}`}
    function render(){renderTree();renderInvites();renderChat();renderContext();renderCanvas();lucide.createIcons()}
    function selectMember(id){selectedMember=id;render()}
    function selectTeam(id){const list=children(id).flatMap(team=>memberSets[team.id]||[]);const member=list[0]||memberSets[id]?.[0]||memberById(selectedMember);if(member)selectedMember=member.id;render()}
    document.getElementById('search').addEventListener('input',event=>{search=event.target.value.trim().toLowerCase();render()});
    document.getElementById('send').addEventListener('click',()=>{const input=document.getElementById('message-input');const text=input.value.trim();if(!text)return;threads[selectedMember]=[...(threads[selectedMember]||[]),{author:'我',initials:'我',time:'刚刚',text}];input.value='';renderChat()});
    document.getElementById('canvas-button').addEventListener('click',()=>document.getElementById('canvas-modal').classList.add('open'));
    document.getElementById('canvas-close').addEventListener('click',()=>document.getElementById('canvas-modal').classList.remove('open'));
    document.getElementById('invite-button').addEventListener('click',()=>document.getElementById('invite-dialog').classList.add('open'));
    document.getElementById('invite-cancel').addEventListener('click',()=>document.getElementById('invite-dialog').classList.remove('open'));
    document.getElementById('invite-submit').addEventListener('click',()=>{const input=document.getElementById('invite-name');invites.push({name:input.value.trim()||'新成员'});input.value='';document.getElementById('invite-dialog').classList.remove('open');renderInvites()});
    render();
  </script>
</body>
</html>
